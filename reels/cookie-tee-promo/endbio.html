<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Pop;src:url(fonts/pop.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:1080px;height:1920px}
#ban{position:absolute;left:110px;width:860px;top:1284px;padding:48px 24px 78px;border-radius:56px;text-align:center;
  background:linear-gradient(180deg,#fff,#ffe6f1);box-shadow:0 18px 40px rgba(150,20,80,.4),inset 0 0 0 6px #f3cf7f}
.l1{font:800 60px/1.1 Pop;white-space:nowrap;color:#d6246e;letter-spacing:1px}
.l1 .kw{color:#fff;background:linear-gradient(180deg,#ff6fb3,#e0287f);padding:0 22px;border-radius:24px;box-shadow:inset 0 0 0 4px #f3cf7f}
.l2{font:800 44px Pop;color:#5a1838;margin-top:22px}
.em{font-family:"Noto Color Emoji";font-weight:400}
</style></head><body>
<img id="bg" src="ek/e001.jpg">
<div id="ban"><div class="l1">Shop the <span class="kw">LINK IN BIO</span> <span class="em">🍪</span></div>
<div class="l2">Tap my profile to grab yours <span class="em">💕</span></div></div>
<script>
const $=id=>document.getElementById(id);const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const N=96;let left=N;const FR=[];for(let i=1;i<=N;i++){const im=new Image();im.onload=im.onerror=()=>{if(--left===0){window.READY=true;render(0)}};im.src='ek/e'+String(i).padStart(3,'0')+'.jpg';FR.push(im);}
window.render=function(t){
  const fi=Math.min(N-1,Math.floor(t*30));if(FR[fi]&&$('bg').src!==FR[fi].src)$('bg').src=FR[fi].src;
  const pulse=1+0.035*Math.sin((t-0.7)*7)*(t>0.7?1:0);
  $('ban').style.transform='scale('+Math.max(0,back((t-0.05)/0.4))*pulse+')';
};
</script></body></html>
