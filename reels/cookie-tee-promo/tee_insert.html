<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Pop;src:url(fonts/pop.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#clip{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.em{font-family:"Noto Color Emoji";font-weight:400}
.pill{position:absolute;left:50%;top:130px;height:92px;padding:0 48px;border-radius:46px;white-space:nowrap;
  background:linear-gradient(180deg,#ff7fbf,#f0408f 55%,#d92a7a);color:#fff;font:800 42px Pop;letter-spacing:3px;
  display:flex;align-items:center;gap:16px;box-shadow:0 12px 28px rgba(120,10,60,.45),inset 0 0 0 4px #f3cf7f}
.cap{position:absolute;left:70px;width:940px;top:1500px;padding:34px 44px;border-radius:46px;background:rgba(255,255,255,.95);
  box-shadow:0 18px 40px rgba(90,10,45,.45),inset 0 0 0 5px #f3cf7f;font:800 64px/1.18 Pop;color:#4a1430;text-align:center}
.cap .hot{color:#e52b86}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff6d6;box-shadow:0 0 14px 5px rgba(255,225,150,.9)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<img id="clip" src="clip/f001.jpg">
<div class="pill" id="pill">NEW HOLIDAY TEE <span class="em">🎄</span></div>
<div class="cap" id="cap">The shirt said<br>what it <span class="hot">said</span> <span class="em">😂</span></div>
<div id="sparks"></div><div id="flash"></div>
<script>
const $=id=>document.getElementById(id);const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const SP=[];for(let i=0;i<22;i++){const d=document.createElement('div');d.className='spark';$('sparks').appendChild(d);SP.push({el:d,x:Math.random()*1080,y:Math.random()*1920,p:Math.random()*6,s:.5+Math.random()*1.1})}
let left=150;const FR=[];for(let i=1;i<=150;i++){const im=new Image();im.onload=im.onerror=()=>{if(--left===0){window.READY=true;render(0)}};im.src='clip/f'+String(i).padStart(3,'0')+'.jpg';FR.push(im);}
window.render=function(t){
  const fi=Math.min(149,Math.floor(t*30*150/135));if(FR[fi]&&$('clip').src!==FR[fi].src)$('clip').src=FR[fi].src;
  $('flash').style.opacity=Math.max(0,.6-t*3);
  $('pill').style.transform=`translateX(-50%) scale(${Math.max(0,back((t-0.15)/0.45))})`;
  $('cap').style.transform=`scale(${Math.max(0,back((t-0.6)/0.45))})`;
  SP.forEach(s=>{const tw=.5+.5*Math.sin(t*3*s.s+s.p);s.el.style.transform=`translate(${s.x}px,${(s.y-t*25*s.s+1920)%1920}px) scale(${tw})`;s.el.style.opacity=tw*.9});
};
</script></body></html>
