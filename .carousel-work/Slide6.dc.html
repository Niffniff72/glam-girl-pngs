<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: #ffd77a; } a:hover { color: #ff8dc7; }
    .root {
      width: 1080px; height: 1350px; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(255,47,146,0.30), transparent 55%),
        radial-gradient(ellipse at 82% 20%, rgba(232,182,75,0.24), transparent 55%),
        #0b0b0d;
      font-family: Poppins, "Segoe UI", sans-serif;
      box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
    }
    .wordmark {
      font-family: Yellowtail, cursive; font-size: 64px; line-height: 1.15; margin-top: 56px;
      background: linear-gradient(90deg, #ffd77a, #ff8dc7, #ffd77a);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 6px 30px rgba(255,47,146,0.4));
    }
    .headline {
      font-family: Montserrat, sans-serif; font-weight: 900; font-size: 44px;
      color: #fff; text-align: center; margin-top: 18px; line-height: 1.2;
    }
    .frame {
      width: 400px; border-radius: 20px; overflow: hidden; margin-top: 26px;
      border: 1px solid rgba(232,182,75,0.35);
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }
    .frame img { display: block; width: 100%; height: auto; }
    .sub {
      font-size: 24px; line-height: 1.5; color: #cfc9d4; text-align: center;
      max-width: 680px; margin-top: 22px;
    }
    .btn {
      margin-top: 26px; padding: 18px 46px; border-radius: 999px;
      background: linear-gradient(135deg, #ff2f92, #c2116a 55%, #e8b64b);
      color: #fff; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 26px;
      box-shadow: 0 16px 40px rgba(255,47,146,0.5);
    }
    .site-badge {
      margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .site-note {
      font-family: Montserrat, sans-serif; font-weight: 700; font-size: 20px;
      letter-spacing: 0.06em; color: #ffd77a;
    }
    .site-url {
      font-family: Poppins, sans-serif; font-weight: 500; font-size: 20px; color: #cfc9d4;
    }
    .dots { position: absolute; bottom: 64px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.18); }
    .dot.active { background: #e8b64b; box-shadow: 0 0 12px rgba(232,182,75,0.7); }
  </style>
</helmet>
<div class="root">
  <div class="wordmark">Glam Girl PNGs</div>
  <div class="headline">The "I Celebrate Me"<br>design.</div>

  <div class="frame">
    <img src="mockup-hero.jpg" alt="I Celebrate Me t-shirt mockup, black and gold flat lay" />
  </div>

  <div class="sub">Yours to press, sell, and repeat.<br>Instant download. Commercial use included.</div>

  <div class="btn">Shop It — Link In Bio →</div>

  <div class="site-badge">
    <div class="site-note">✨ Our new website is live ✨</div>
    <div class="site-url">niffniff72.github.io/glam-girl-pngs</div>
  </div>

  <div class="dots">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot active"></span>
  </div>
</div>
</x-dc>
</body>
</html>
