<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Montserrat:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    .root {
      width: 1080px; height: 1350px; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,47,146,0.22), transparent 60%),
        #0b0b0d;
      font-family: Poppins, "Segoe UI", sans-serif;
      box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
    }
    .wordmark {
      font-family: Yellowtail, cursive; font-size: 34px; line-height: 1;
      color: #ffd77a; opacity: 0.85;
    }
    .eyebrow {
      font-family: Montserrat, sans-serif; font-weight: 700; font-size: 26px;
      letter-spacing: 0.18em; text-transform: uppercase; color: #e8b64b;
      text-align: center;
    }
    .frame {
      width: 620px; border-radius: 22px; overflow: hidden; margin-top: 40px;
      border: 1px solid rgba(232,182,75,0.35);
      box-shadow: 0 30px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(232,182,75,0.15);
    }
    .frame img { display: block; width: 100%; height: auto; }
    .caption {
      font-size: 32px; line-height: 1.5; color: #fff6ea; text-align: center;
      max-width: 780px; margin-top: 48px;
    }
    .caption strong { color: #ffd77a; }
    .dots { position: absolute; bottom: 64px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.18); }
    .dot.active { background: #e8b64b; box-shadow: 0 0 12px rgba(232,182,75,0.7); }
  </style>
</helmet>
<div class="root">
  <div style="position:absolute; top:72px; left:80px;" class="wordmark">Glam Girl PNGs</div>

  <div style="margin-top:160px;" class="eyebrow">I Celebrate Me — New Design</div>

  <div class="frame">
    <img src="mockup-hero.jpg" alt="I Celebrate Me t-shirt mockup, black and gold flat lay" />
  </div>

  <div class="caption">
    Download it today. Press it tonight.<br>
    It's live in your shop <strong>before your coffee's even cold</strong> tomorrow.
  </div>

  <div class="dots">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot active"></span><span class="dot"></span>
  </div>
</div>
</x-dc>
</body>
</html>
